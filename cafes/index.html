<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Oferta exclusiva em produtos selecionados. Aproveite descontos imperdíveis por tempo limitado.">
    <title>Oferta Exclusiva | Loja Oficial</title>
    
    <!-- Preconnect para fontes externas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-navy: #1a2b4c;
            --accent-universal: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-gold: #b59461;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-soft: #f8fafc;
            --white: #ffffff;
            --shadow-soft: 0 20px 40px rgba(0,0,0,0.05);
            --shadow-strong: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ajuste de Enquadramento Global */
        html, body {
            height: 100%;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* Garante que o conteúdo nunca encoste nas bordas em telas muito pequenas */
            padding: 20px;
            background: radial-gradient(circle at top right, #eff6ff 0%, var(--bg-soft) 50%, #f1f5f9 100%);
        }

        /* Elementos Decorativos de Fundo */
        .bg-elements {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .circle-1 {
            top: -10%;
            right: -5%;
            width: 50vw;
            height: 50vw;
            background: var(--accent-universal);
        }

        .circle-2 {
            bottom: -10%;
            left: -5%;
            width: 40vw;
            height: 40vw;
            background: var(--accent-gold);
        }

        /* Container Principal com Enquadramento Dinâmico */
        .card {
            width: 100%;
            max-width: 420px;
            /* Ajuste de altura mínima para evitar saltos de layout */
            min-height: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: clamp(2rem, 5vh, 3.5rem) clamp(1.5rem, 5vw, 2.5rem);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 1;
            /* Margem para separar do rodapé em telas pequenas */
            margin: auto 0;
        }

        /* Logo com tamanho adaptável */
        .logo-wrapper {
            margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
        }

        .logo-circle {
            width: clamp(80px, 15vh, 110px);
            height: clamp(80px, 15vh, 110px);
            background: var(--white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
        }

        .logo-circle img {
            width: 100%;
            height: auto;
            max-height: 100%;
            object-fit: contain;
        }

        /* Conteúdo de Texto */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--accent-universal);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 100px;
            margin-bottom: 1rem;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vh, 2.4rem);
            color: var(--primary-navy);
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .title span {
            display: block;
            font-weight: 700;
            color: var(--primary-navy);
            letter-spacing: -0.5px;
        }

        .offer-value {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 10vh, 5rem);
            font-weight: 700;
            color: var(--primary-navy);
            line-height: 1;
            margin: 0.5rem 0 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .offer-value::after {
            content: '';
            width: 40px;
            height: 3px;
            background: var(--accent-gold);
            margin-top: 8px;
            border-radius: 2px;
        }

        .description {
            font-size: clamp(0.85rem, 2vh, 1rem);
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
            max-width: 320px;
        }

        /* Botão de Ação */
        .cta-container {
            width: 100%;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: clamp(1rem, 2.5vh, 1.3rem);
            background: var(--accent-universal);
            color: var(--white);
            text-decoration: none;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--shadow-strong);
            gap: 12px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .icon-arrow {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover .icon-arrow {
            transform: translateX(5px);
        }

        .footer-note {
            margin-top: 1.2rem;
            font-size: 0.65rem;
            color: #94a3b8;
        }

        /* Rodapé de Conformidade com Enquadramento Fixo */
        .compliance-footer {
            width: 100%;
            max-width: 600px;
            text-align: center;
            padding: 20px 10px;
            margin-top: 20px;
            z-index: 1;
        }

        .compliance-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: clamp(10px, 3vw, 20px);
            margin-bottom: 10px;
        }

        .compliance-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .compliance-links a:hover {
            color: var(--accent-universal);
        }

        .copyright {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Animações */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate {
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        /* Ajustes para telas muito pequenas ou horizontais */
        @media (max-height: 600px) {
            body { padding: 10px; justify-content: flex-start; }
            .card { padding: 1.5rem; margin: 10px 0; }
            .logo-wrapper { margin-bottom: 1rem; }
            .description { margin-bottom: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-elements">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="card animate">
        <header class="logo-wrapper">
            <div class="logo-circle">
                <img src="https://cdn.shopify.com/s/files/1/0697/8175/0016/files/dolce-gusto-logo-round_0_png.webp?v=1751370845" alt="Logo Oficial">
            </div>
        </header>

        <section class="content">
            <span class="badge animate delay-1">Oferta Exclusiva</span>
            <h1 class="title animate delay-1">Sabor <span>Incomparável</span></h1>
            <div class="offer-value animate delay-2">40% OFF</div>
            <p class="description animate delay-2">
                Desconto especial em produtos selecionados. Aproveite a melhor experiência com condições imperdíveis.
            </p>
        </section>

        <footer class="cta-container animate delay-3">
            <button id="cta-button" class="btn-primary">
                <span id="btn-text">Aproveitar Agora</span>
                <svg class="icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
            <p class="footer-note">*Válido enquanto durarem os estoques.</p>
        </footer>
    </main>

    <footer class="compliance-footer animate delay-3">
        <nav class="compliance-links">
            <a href="/policies/privacy-policy">Privacidade</a>
            <a href="/policies/terms-of-service">Termos</a>
            <a href="/policies/refund-policy">Reembolso</a>
            <a href="/pages/contato">Contato</a>
        </nav>
        <p class="copyright">© 2024 Loja Oficial. Todos os direitos reservados.</p>
    </footer>

    <script>
        const DESTINATION_URL = 'https://vitaldue.myshopify.com/products/comboseiscaixas';
        const ctaButton = document.getElementById('cta-button');
        const btnText = document.getElementById('btn-text');

        function resetButton() {
            ctaButton.disabled = false;
            btnText.textContent = 'Aproveitar Agora';
        }

        ctaButton.addEventListener('click', function(e) {
            e.preventDefault();
            this.disabled = true;
            btnText.textContent = 'Carregando...';
            setTimeout(() => {
                window.location.href = DESTINATION_URL;
            }, 300);
        });

        window.addEventListener('pageshow', function(event) {
            resetButton();
        });
    </script>

</body>
</html>
