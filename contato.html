<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Contato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #1d1d1f;
            --accent-universal: #0071e3;
            --accent-hover: #0077ed;
            --accent-gold: #86868b;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --bg-soft: #f5f5f7;
            --white: #ffffff;
            --shadow-soft: 0 20px 40px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            line-height: 1.6;
            background: radial-gradient(circle at top right, #e8e8ed 0%, var(--bg-soft) 50%, #ffffff 100%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            padding: 40px 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2.5rem 1.5rem;
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent-universal);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 20px;
            gap: 8px;
        }

        h1 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--primary-navy); }
        p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.95rem; }

        .contact-method {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--bg-soft);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }

        .contact-method:hover { transform: translateY(-2px); }

        .icon-box {
            width: 40px;
            height: 40px;
            background: var(--white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-universal);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .method-info strong { display: block; font-size: 0.9rem; }
        .method-info span { font-size: 0.85rem; color: var(--text-muted); }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--accent-universal);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="javascript:history.back()" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Voltar
        </a>

        <div class="card">
            <h1>Fale Conosco</h1>
            <p>Estamos aqui para ajudar. Escolha o canal de sua preferência ou envie uma mensagem abaixo.</p>

            <a href="megaofertasonllin@gmail.com" class="contact-method">
                <div class="icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <div class="method-info">
                    <strong>E-mail</strong>
                    <span>megaofertasonllin@gmail.com</span>
                </div>
            </a>

            <a href="https://wa.me/5500000000000" class="contact-method">
                <div class="icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-10.6 8.38 8.38 0 0 1 3.8.9L21 3.5z"></path></svg>
                </div>
                <div class="method-info">
                    <strong>Telefone</strong>
                    <span>9188 - 9910</span>
                </div>
            </a>

            <form style="margin-top: 30px;">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea rows="4" placeholder="Como podemos ajudar?"></textarea>
                </div>
                <button type="button" class="btn-submit">ENVIAR MENSAGEM</button>
            </form>
        </div>

        <div class="footer">
            &copy; 2026 Mega Ofertas Ltda.. Todos os direitos reservados.
        </div>
    </div>
</body>
</html>
